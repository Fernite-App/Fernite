name: Fernite Launcher build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/theseus-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
  workflow_dispatch:
    inputs:
      sign-windows-binaries:
        description: Sign Windows binaries
        type: boolean
        default: false
        required: false
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
        default: prod
        required: false

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - platform: macos-latest
            artifact-target-name: universal-apple-darwin
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            artifact-target-name: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: ${{ startsWith(matrix.platform, 'macos') && 'x86_64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Fernite Launcher (dev-${GIT_HASH})",
            "mainBinaryName": "Fernite Launcher (dev-${GIT_HASH})",
            "identifier": "FerniteLauncher-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Make Gradle wrapper executable
        run: |
          chmod +x packages/app-lib/java/gradlew
          chmod +x packages/app-lib/java/gradlew.bat

      - name: Make Gradle wrapper executable
        run: |
          chmod +x packages/app-lib/java/gradlew
          chmod +x packages/app-lib/java/gradlew.bat

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ startsWith(matrix.platform, 'windows') && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="$(git describe --tags --always | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env

      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: Install dependencies
        run: pnpm install

      - name: Make Gradle wrapper executable
        run: |
          chmod +x packages/app-lib/java/gradlew
          chmod +x packages/app-lib/java/gradlew.bat

      - name: Set up Windows code signing
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          dasel delete -f apps/app/tauri-release.conf.json 'bundle.windows.signCommand'

      - name: Build macOS app
        run: |
          chmod +x packages/app-lib/java/gradlew
          chmod +x packages/app-lib/java/gradlew.bat
          pnpm --filter=@fernite/app run tauri build --target universal-apple-darwin --config tauri-dev.conf.json
        if: startsWith(matrix.platform, 'macos')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Linux app
        run: |
          chmod +x packages/app-lib/java/gradlew
          chmod +x packages/app-lib/java/gradlew.bat
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'pnpm --filter=@fernite/app run tauri build --config tauri-release.conf.json' || 'pnpm --filter=@fernite/app run tauri build --config tauri-dev.conf.json' }}
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Windows app
        run: |
          chmod +x packages/app-lib/java/gradlew
          chmod +x packages/app-lib/java/gradlew.bat
          pnpm --filter=@fernite/app run tauri build --config tauri-dev.conf.json --verbose --bundles "nsis,updater"
        if: startsWith(matrix.platform, 'windows')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          path: |
            target/release/bundle/appimage/Fernite Launcher_*.AppImage*
            target/release/bundle/deb/Fernite Launcher_*.deb*
            target/release/bundle/rpm/Fernite Launcher-*.rpm*
            target/release/bundle/appimage/Fernite Launcher (dev-*)_*.AppImage*
            target/release/bundle/deb/Fernite Launcher (dev-*)_*.deb*
            target/release/bundle/rpm/Fernite Launcher (dev-*)-*.rpm*
            target/universal-apple-darwin/release/bundle/macos/Fernite Launcher.app.tar.gz*
            target/universal-apple-darwin/release/bundle/macos/Fernite Launcher (dev-*)*.app.tar.gz
            target/universal-apple-darwin/release/bundle/dmg/Fernite Launcher (dev-*)*.dmg
            target/universal-apple-darwin/release/bundle/dmg/Fernite Launcher_*.dmg*
            target/release/bundle/nsis/Fernite Launcher_*-setup.exe*
            target/release/bundle/nsis/Fernite Launcher (dev-*)_*-setup.exe*
            target/release/bundle/nsis/Fernite Launcher_*-setup.nsis.zip*
